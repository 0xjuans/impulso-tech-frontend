<div class="pw" [class.pw--disabled]="disabled()">
  <input
    class="pw__input"
    [id]="id"
    [type]="visible() ? 'text' : 'password'"
    [placeholder]="placeholder"
    [attr.autocomplete]="autocomplete"
    [attr.aria-invalid]="ariaInvalid"
    [value]="value()"
    [disabled]="disabled()"
    (input)="onInput($event)"
    (blur)="onBlur()" />

  <button
    type="button"
    class="pw__toggle"
    (click)="toggleVisibility()"
    [attr.aria-pressed]="visible()"
    [attr.aria-label]="visible() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
    [disabled]="disabled()"
    tabindex="0">
    @if (visible()) {
      <!-- Ojo tachado (contraseña visible) -->
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path fill="currentColor"
          d="M12 6a9.77 9.77 0 0 1 8.94 5.9c-.29.68-.66 1.32-1.09 1.9l1.45 1.45c.94-1.13 1.68-2.44 2.14-3.87A11.85 11.85 0 0 0 12 4a11.8 11.8 0 0 0-3.98.69l1.66 1.66c.75-.22 1.53-.35 2.32-.35Zm-1.07 1.14L12 8.21c1.86 0 3.5 1.14 4.14 2.85l1.34 1.34a4.5 4.5 0 0 0-5.34-5.26ZM2.71 3.16 1.29 4.58l3.11 3.11A11.83 11.83 0 0 0 1 12a11.85 11.85 0 0 0 11 8c1.52 0 2.98-.29 4.32-.82l3.42 3.42 1.42-1.42L2.71 3.16Zm5.53 5.53 1.55 1.55A2.5 2.5 0 0 0 12 14.5c.34 0 .67-.07.97-.19l1.55 1.55A4.5 4.5 0 0 1 7.5 12c0-1.29.55-2.46 1.44-3.31Zm-2.68-2.68 1.5 1.5A9.77 9.77 0 0 0 3.06 12 9.77 9.77 0 0 0 12 17.9c.63 0 1.24-.06 1.83-.19l1.7 1.7c-.98.25-1.99.39-3.03.39a11.85 11.85 0 0 1-11-8 11.85 11.85 0 0 1 4.06-5.13Z" />
      </svg>
    } @else {
      <!-- Ojo (contraseña oculta) -->
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path fill="currentColor"
          d="M12 6a9.77 9.77 0 0 1 8.94 5.9A9.77 9.77 0 0 1 12 17.9 9.77 9.77 0 0 1 3.06 12 9.77 9.77 0 0 1 12 6Zm0-2a11.85 11.85 0 0 0-11 8 11.85 11.85 0 0 0 11 8 11.85 11.85 0 0 0 11-8 11.85 11.85 0 0 0-11-8Zm0 4a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z" />
      </svg>
    }
  </button>
</div>
