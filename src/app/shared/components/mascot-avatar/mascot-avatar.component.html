<!--
  Avatar de la mascota IA. Muestra una de las 8 ilustraciones alojadas en
  public/mascot/<pose>.webp con transición suave (fundido cruzado + leve
  escala) al cambiar de estado. La animación de respiración se mantiene
  siempre activa para dar sensación de vida.
-->
<div
  class="mascot-avatar"
  [class]="'is-' + pose()"
  [style.--mascot-size.px]="sizePx"
  aria-hidden="true">
  <img
    class="mascot-avatar__pose"
    [src]="imageSrc()"
    [alt]="alt()"
    draggable="false"
    loading="eager" />
</div>
