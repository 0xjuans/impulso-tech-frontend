<!--
  Barra de navegación superior. El atributo data-scrolled controla la
  transición a un fondo sólido cuando el usuario abandona el hero.
-->
<header class="nav" [ngClass]="{ 'nav--scrolled': scrolled(), 'nav--open': menuOpen() }">
  <div class="nav__inner container">
    <a class="nav__brand" routerLink="/" (click)="closeMenu()" aria-label="Impulso Tech — Inicio">
      <span class="nav__brand-name">
        <span class="nav__brand-prompt" aria-hidden="true">&gt;</span>
        Impulso<span class="nav__brand-accent">.tech</span>
        <span class="nav__brand-caret" aria-hidden="true"></span>
      </span>
    </a>

    <nav class="nav__links" aria-label="Navegación principal">
      <a class="nav__link" href="#rutas" (click)="closeMenu()">Rutas</a>
      <a class="nav__link" href="#laboratorios" (click)="closeMenu()">Laboratorios</a>
      <a class="nav__link" href="#comunidad" (click)="closeMenu()">Comunidad</a>
    </nav>

    <div class="nav__actions">
      <a class="nav__link nav__link--muted" routerLink="/auth/login">Iniciar sesión</a>
      <a class="btn btn--primary btn--sm" routerLink="/auth/register">Crear cuenta</a>
    </div>

    <!--
      Botón de menú inspirado en un editor de código: tres líneas de
      diferente longitud representan sentencias y un cursor naranja
      parpadea al final de la primera. Al abrirse, las líneas se
      transforman en una "X" y el cursor se detiene, indicando que el
      "programa" del menú está en pausa.
    -->
    <button
      type="button"
      class="code-menu"
      [class.is-open]="menuOpen()"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="nav-mobile"
      [attr.aria-label]="menuOpen() ? 'Cerrar menú' : 'Abrir menú'">
      <span class="code-menu__glyph" aria-hidden="true">
        <span class="code-menu__line code-menu__line--1"></span>
        <span class="code-menu__line code-menu__line--2"></span>
        <span class="code-menu__line code-menu__line--3"></span>
        <span class="code-menu__caret"></span>
      </span>
    </button>
  </div>
</header>
