<!-- Layout principal del área privada del instructor -->
<div class="shell" [ngClass]="{ 'shell--menu-open': menuOpen() }">
  <aside class="shell__side" aria-label="Navegación del instructor">
    <a class="shell__brand" routerLink="/instructor/dashboard" (click)="closeMenu()">
      <span class="shell__brand-mark" aria-hidden="true">◐</span>
      <span>Impulso<span class="shell__brand-accent">.tech</span></span>
    </a>

    <span class="shell__role">Panel del instructor</span>

    <nav class="shell__nav">
      @for (item of navItems; track item.path) {
        <a
          class="shell__link"
          [routerLink]="item.path"
          routerLinkActive="is-active"
          (click)="closeMenu()">
          <span class="shell__link-icon" aria-hidden="true">{{ item.icon }}</span>
          <span class="shell__link-label">{{ item.label }}</span>
        </a>
      }
    </nav>

    <button type="button" class="shell__logout" (click)="logout()">
      <span aria-hidden="true">⎋</span>
      Cerrar sesión
    </button>
  </aside>

  @if (menuOpen()) {
    <button
      type="button"
      class="shell__scrim"
      (click)="closeMenu()"
      aria-label="Cerrar menú"></button>
  }

  <header class="shell__top">
    <button
      type="button"
      class="shell__burger"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-label="Abrir menú">
      <span></span><span></span><span></span>
    </button>

    <div class="shell__top-right">
      <div class="shell__top-user" aria-live="polite">
        <div class="shell__avatar" aria-hidden="true">{{ initials() }}</div>
        <div class="shell__user-meta">
          <strong>{{ displayName() }}</strong>
          <small>&#64;{{ user()?.username }}</small>
        </div>
      </div>
    </div>
  </header>

  <main class="shell__main">
    <router-outlet />
  </main>
</div>
