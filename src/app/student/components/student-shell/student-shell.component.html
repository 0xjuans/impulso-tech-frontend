<!-- Layout principal del área privada del estudiante -->
<div
  class="shell"
  [ngClass]="{
    'shell--menu-open': menuOpen(),
    'shell--collapsed': sideCollapsed()
  }">
  <!-- Barra lateral -->
  <aside class="shell__side" aria-label="Navegación principal">
    <a
      class="shell__brand"
      routerLink="/student/home"
      (click)="closeMenu()"
      [attr.title]="sideCollapsed() ? 'Impulso Tech' : null">
      <span class="shell__brand-prompt" aria-hidden="true">&gt;</span>
      <span class="shell__brand-text">
        Impulso<span class="shell__brand-accent">.tech</span>
      </span>
      <span class="shell__brand-caret" aria-hidden="true"></span>
    </a>

    <nav class="shell__nav">
      @for (item of navItems; track item.path) {
        <a
          class="shell__link"
          [routerLink]="item.path"
          routerLinkActive="is-active"
          (click)="closeMenu()"
          [attr.title]="sideCollapsed() ? item.label : null">
          <span class="shell__link-icon">
            <app-icon [name]="item.icon" [sizePx]="20" />
            @if (item.path === 'messages' && messagesUnread() > 0) {
              <span class="shell__link-dot" aria-hidden="true"></span>
            }
          </span>
          <span class="shell__link-label">{{ item.label }}</span>
          @if (item.path === 'messages' && messagesUnread() > 0) {
            <span class="shell__link-badge" aria-label="Mensajes sin leer">
              {{ messagesUnread() > 99 ? '99+' : messagesUnread() }}
            </span>
          }
          <span class="shell__tooltip" aria-hidden="true">{{ item.label }}</span>
        </a>
      }
    </nav>

    <button
      type="button"
      class="shell__logout"
      (click)="logout()"
      [attr.title]="sideCollapsed() ? 'Cerrar sesión' : null">
      <span class="shell__link-icon"><app-icon name="logout" [sizePx]="20" /></span>
      <span class="shell__link-label">Cerrar sesión</span>
      <span class="shell__tooltip" aria-hidden="true">Cerrar sesión</span>
    </button>
  </aside>

  <!-- Pestaña flotante anclada al borde del sidebar para colapsarlo o
       expandirlo. Se desliza con el ancho de la barra y se oculta en
       mobile, donde el burger cumple la misma función. -->
  <button
    type="button"
    class="shell__side-toggle"
    (click)="toggleSideCollapsed()"
    [attr.aria-expanded]="!sideCollapsed()"
    [attr.aria-label]="sideCollapsed() ? 'Expandir menú' : 'Colapsar menú'"
    [attr.title]="sideCollapsed() ? 'Expandir menú' : 'Colapsar menú'">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2.4"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      @if (sideCollapsed()) {
        <path d="m9 18 6-6-6-6" />
      } @else {
        <path d="m15 18-6-6 6-6" />
      }
    </svg>
  </button>

  <!-- Cortina para cerrar el menú lateral en mobile al hacer clic fuera. -->
  @if (menuOpen()) {
    <button
      type="button"
      class="shell__scrim"
      (click)="closeMenu()"
      aria-label="Cerrar menú"></button>
  }

  <!-- Cabecera superior -->
  <header class="shell__top">
    <button
      type="button"
      class="shell__burger"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-label="Abrir menú">
      <span></span><span></span><span></span>
    </button>

    <div class="shell__top-right">
      <app-notifications-bell />

      <app-user-pill />
    </div>
  </header>

  <!-- Contenido principal -->
  <main class="shell__main">
    <router-outlet />
  </main>

  <!-- Widget flotante de la mascota IA -->
  <app-mascot-widget />
</div>
