<!-- Layout principal del área privada del estudiante -->
<div
  class="shell"
  [ngClass]="{
    'shell--menu-open': menuOpen(),
    'shell--collapsed': sideCollapsed()
  }">
  <!-- Barra lateral -->
  <aside class="shell__side" aria-label="Navegación principal">
    <a
      class="shell__brand"
      routerLink="/student/home"
      (click)="closeMenu()"
      [attr.title]="sideCollapsed() ? 'Impulso Tech' : null">
      <span class="shell__brand-prompt" aria-hidden="true">&gt;</span>
      <span class="shell__brand-text">
        Impulso<span class="shell__brand-accent">.tech</span>
      </span>
      <span class="shell__brand-caret" aria-hidden="true"></span>
    </a>

    <nav class="shell__nav">
      @for (item of navItems; track item.path) {
        <a
          class="shell__link"
          [routerLink]="item.path"
          routerLinkActive="is-active"
          (click)="closeMenu()"
          [attr.title]="sideCollapsed() ? item.label : null">
          <span class="shell__link-icon">
            <app-icon [name]="item.icon" [sizePx]="18" />
          </span>
          <span class="shell__link-label">{{ item.label }}</span>
          <span class="shell__tooltip" aria-hidden="true">{{ item.label }}</span>
        </a>
      }
    </nav>

    <button
      type="button"
      class="shell__logout"
      (click)="logout()"
      [attr.title]="sideCollapsed() ? 'Cerrar sesión' : null">
      <span class="shell__link-icon">
        <app-icon name="logout" [sizePx]="16" />
      </span>
      <span class="shell__link-label">Cerrar sesión</span>
      <span class="shell__tooltip" aria-hidden="true">Cerrar sesión</span>
    </button>
  </aside>

  <!-- Cortina para cerrar el menú lateral en mobile al hacer clic fuera. -->
  @if (menuOpen()) {
    <button
      type="button"
      class="shell__scrim"
      (click)="closeMenu()"
      aria-label="Cerrar menú"></button>
  }

  <!-- Cabecera superior -->
  <header class="shell__top">
    <button
      type="button"
      class="shell__burger"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-label="Abrir menú">
      <span></span><span></span><span></span>
    </button>

    <div class="shell__top-right">
      <app-notifications-bell />

      <div class="shell__top-user" aria-live="polite">
        <div class="shell__avatar" aria-hidden="true">{{ initials() }}</div>
        <div class="shell__user-meta">
          <strong>{{ displayName() }}</strong>
          <small>&#64;{{ user()?.username }}</small>
        </div>
      </div>
    </div>
  </header>

  <!-- Botón para colapsar/expandir la barra sin ocultarla del todo.
       Se ancla al borde exterior de la barra, mitad afuera / mitad
       adentro, al estilo Notion / Linear / VS Code. Vive fuera del
       aside para no romper el overflow del panel. -->
  <button
    type="button"
    class="shell__side-toggle"
    (click)="toggleSideCollapsed()"
    [attr.aria-expanded]="!sideCollapsed()"
    [attr.aria-label]="sideCollapsed() ? 'Expandir menú' : 'Colapsar menú'"
    [attr.title]="sideCollapsed() ? 'Expandir menú' : 'Colapsar menú'">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2.4"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      @if (sideCollapsed()) {
        <path d="m9 6 6 6-6 6" />
      } @else {
        <path d="m15 6-6 6 6 6" />
      }
    </svg>
  </button>

  <!-- Contenido principal -->
  <main class="shell__main">
    <router-outlet />
  </main>

  <!-- Widget flotante de la mascota IA -->
  <app-mascot-widget />
</div>
